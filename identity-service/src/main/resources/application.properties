spring.application.name=identity-service

spring.config.import=optional:file:.env[.properties]

server.port=8081
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

jwt.secret-key=${JWT_SECRET_KEY}
jwt.issuer=${JWT_ISSUER:identity-service}
jwt.audience=${JWT_AUDIENCE:taskflow-api}

identity.registration.require-email-verification=false
security.auth.max-failures=5
security.auth.failure-window-seconds=900
security.auth.lockout-seconds=900
security.rate-limit.window-seconds=900
security.rate-limit.login-per-ip=30
security.rate-limit.login-per-identifier-ip=5
security.rate-limit.otp-per-ip=30
security.rate-limit.otp-per-identifier-ip=5
security.rate-limit.register-per-ip=10
security.rate-limit.refresh-per-ip=60
security.session.access-duration-seconds=900
security.session.idle-timeout-seconds=2592000
security.session.absolute-timeout-seconds=2592000
security.session.refresh-duration-seconds=2592000